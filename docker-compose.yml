services:
  schulmanager:
    image: ghcr.io/jbkunama1/trt.schulmanager:latest
    # Alternative für lokale Builds (ohne GHCR) — image-Zeile auskommentieren:
    # build: .
    container_name: trt-schulmanager
    ports:
      - "8086:8080"
    volumes:
      - schulmanager-data:/data
    environment:
      - APP_PASSWORD=lehrer2026
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - REMINDER_TIME=17:30
      - UPLOAD_CODE=
    networks:
      - highfishNetwork

volumes:
  schulmanager-data:

networks:
  highfishNetwork:
    external: true
