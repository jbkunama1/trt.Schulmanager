services:
  schulmanager:
    image: ghcr.io/jbkunama1/trt.schulmanager:latest
    # Alternative für lokale Builds (ohne GHCR) — image-Zeile auskommentieren:
    # build: .
    container_name: trt-schulmanager
    ports:
      - "8086:8080"
    volumes:
      - schulmanager-data:/data
    environment:
      # Login-Passwort der Web-App — in Portainer anpassen!
      - APP_PASSWORD=lehrer2026
      # 🤖 Telegram-Bot (Token von @BotFather; leer lassen = Telegram deaktiviert)
      - TELEGRAM_BOT_TOKEN=
      # Deine Chat-ID (erhältst du per /start vom Bot; leer = Bot antwortet jedem mit dessen ID)
      - TELEGRAM_CHAT_ID=
      # ⏰ Tägliche Klassenbuch-Erinnerung Mo–Fr, z. B. 17:30 (leer = Erinnerung deaktiviert)
      - REMINDER_TIME=17:30
      # 📎 Zugangscode für Schüler-Uploads unter /upload (leer = Upload ohne Code möglich)
      - UPLOAD_CODE=
    networks:
      - highfishNetwork

networks:
  highfishNetwork:
    external: true
